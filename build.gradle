plugins {
    id 'com.barrybecker4.bb4.scala-library' version '3.0-SNAPSHOT'
    id 'com.barrybecker4.bb4.publish' version '3.0-SNAPSHOT'
    id 'com.barrybecker4.bb4.application' version '3.0-SNAPSHOT'
}

description = 'Sound and speech synthesis library'
group = 'com.barrybecker4'
version = '3.0-SNAPSHOT'

bb4 {
    archivesBaseName.set('bb4-sound')
    mainClass.set('com.barrybecker4.sound.midi.MidiSynth')
}

// Gradle 9 + Scala: main classes land in both java/main and scala/main outputs; jar must dedupe.
tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Keep resource-only tree on main classpath (allophones under source/)
sourceSets {
    main {
        scala.srcDirs = ['scala-source']
        java.srcDirs = []
    }
    test {
        scala.srcDirs = ['scala-test']
        java.srcDirs = []
    }
}

tasks.withType(ScalaCompile).configureEach {
    scalaCompileOptions.additionalParameters += ['-deprecation', '-Wunused:imports']
}

dependencies {
    implementation 'com.barrybecker4:bb4-common:3.0-SNAPSHOT'
}

test {
    maxParallelForks = 1
}
