plugins {
    id 'com.barrybecker4.bb4.scala-library' version '2.1-SNAPSHOT'
    id 'com.barrybecker4.bb4.publish' version '2.1-SNAPSHOT'
    id 'com.barrybecker4.bb4.application' version '2.1-SNAPSHOT'
}

description = 'Sound and speech synthesis library'
group = 'com.barrybecker4'
version = '2.1-SNAPSHOT'

bb4 {
    archivesBaseName.set('bb4-sound')
    mainClass.set('com.barrybecker4.sound.midi.MidiSynth')
}

tasks.withType(ScalaCompile).configureEach {
    scalaCompileOptions.additionalParameters += ['-deprecation', '-Wunused:imports']
}

dependencies {
    implementation 'com.barrybecker4:bb4-common:2.1-SNAPSHOT'
}

test {
    maxParallelForks = 1
}
