name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  repository_dispatch:
    types: [ upstream-updated ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and test
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            ./gradlew clean build --refresh-dependencies --info
          else
            ./gradlew build --info
          fi

      - name: Publish SNAPSHOT
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: ./gradlew publish

      - name: Notify downstream repos
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.BB4_DISPATCH_TOKEN }}
        run: |
          DOWNSTREAM=(bb4-adventure bb4-experimentation bb4-games bb4-puzzles bb4-simulations)
          for repo in "${DOWNSTREAM[@]}"; do
            echo "Notifying $repo"
            gh api "repos/bb4/$repo/dispatches" \
              -f event_type=upstream-updated \
              -f "client_payload[upstream]=${{ github.event.repository.name }}"
          done
